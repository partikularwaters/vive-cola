<!doctype html>
<!-- Source of assets/og-card.png. Render from the repo root:
  "/Applications/Brave Browser.app/Contents/MacOS/Brave Browser" --headless=new --hide-scrollbars \
    --force-device-scale-factor=1 --virtual-time-budget=4000 --window-size=1200,630 \
    --screenshot="$PWD/assets/og-card.png" "file://$PWD/design-demos/og-card.html" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>VIVE OG card · VIVI's Pick (final, renders to assets/og-card.png)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap">
<style>
  :root { --orange:#F27A21; --navy:#2B3990; --sun:#F4BD6A; --white:#F9F9F9; --deep:#1D2766; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { width:1200px; height:630px; overflow:hidden; position:relative; background:var(--navy); font-family:Montserrat, sans-serif; -webkit-font-smoothing:antialiased; }
  .tri { position:absolute; width:0; height:0; }
  .t1 { right:-40px; top:-50px; border-left:130px solid transparent; border-right:130px solid transparent; border-top:170px solid var(--orange); transform:rotate(18deg); }
  .t2 { left:560px; bottom:28px; border-left:30px solid transparent; border-right:30px solid transparent; border-bottom:52px solid var(--sun); transform:rotate(-16deg); }
  .copy { position:absolute; left:80px; top:92px; width:560px; }
  .copy > img { width:220px; height:auto; display:block; }
  .label { display:inline-block; margin-top:34px; background:var(--sun); color:var(--navy); font-weight:900; font-size:22px; letter-spacing:.06em; text-transform:uppercase; padding:8px 26px 8px 16px; transform:rotate(-3deg); clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%); }
  h1 { margin:18px 0 0; color:var(--white); font-weight:900; text-transform:uppercase; font-size:66px; line-height:.92; }
  h1 em { font-style:normal; color:var(--orange); display:block; }
  .row { display:flex; gap:18px; align-items:flex-end; margin-top:30px; }
  .row img { width:52px; height:auto; }
  .row span { color:var(--white); font-weight:700; font-size:21px; margin-left:8px; padding-bottom:6px; }
  .star { position:absolute; left:668px; top:40px; width:560px; height:560px; transform:rotate(-8deg); }
  .vivi { position:absolute; left:760px; top:106px; width:372px; height:auto; }
</style>
</head>
<body>
  <span class="tri t1"></span><span class="tri t2"></span>
  <img class="star" src="../assets/shapes/star-10pt-white.svg" alt="">
  <img class="vivi" src="../assets/mascot/vivi-pointing.webp" alt="">
  <div class="copy">
    <img src="../assets/wordmark-vive-white.png" alt="VIVE">
    <span class="label">The vitamin-charged cola</span>
    <h1>Your dose of <em>good vibes</em></h1>
    <div class="row">
      <img src="../assets/can-glow-web.webp" alt=""><img src="../assets/can-classic-web.webp" alt=""><img src="../assets/can-focus-web.webp" alt="">
      <span>vive-cola.vercel.app</span>
    </div>
  </div>
</body>
</html>
