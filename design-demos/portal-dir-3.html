<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VIVE Web Portal — Direction 3: Night Stage</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap');
  @page { size: 595.28pt 841.89pt; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --orange:#F27A21; --navy:#2B3990; --sun:#F4BD6A; --white:#F9F9F9; --deep:#1D2766; }
  html, body { width: 595.28pt; height: 841.89pt; overflow: hidden; position: relative;
               font-family: 'Montserrat', sans-serif; }
  a.global-router-overlay { position:absolute; top:0; left:0; width:595.28pt; height:841.89pt; z-index:1000; display:block; text-decoration:none; }
  .abs { position:absolute; display:block; }
  .tag { font-size:10.5pt; font-weight:800; letter-spacing:.16em; text-transform:uppercase; white-space:nowrap; }
  .url { font-weight:900; white-space:nowrap; letter-spacing:-.01em; }
  .hint { font-size:10pt; font-weight:600; letter-spacing:.04em; white-space:nowrap; }

  body { background: var(--navy); }
  .banner { left:-10pt; top:716pt; width:615pt; height:96pt; background: var(--orange); transform: rotate(-3deg); }

</style>
</head>
<body>
<a class="global-router-overlay" href="https://vive-cola.vercel.app" aria-label="Visit the VIVE website at vive-cola.vercel.app">&nbsp;</a>
<img class="abs" src="assets/wordmark-vive-white.png" alt="VIVE" style="left:227.6pt;top:36pt;width:140pt;height:35.9pt">
<span class="abs tag" style="left:0;width:595.28pt;text-align:center;top:84pt;color:var(--sun)">Official Web Portal</span>
<img class="abs" src="assets/shapes/star-10pt-outline-sun.svg" alt="" style="left:47pt;top:150pt;width:501pt;height:501pt;z-index:0">
<img class="abs" src="assets/shapes/triangle-equilateral-white.svg" alt="" style="left:40pt;top:170pt;width:40pt;height:40pt;transform:rotate(-18deg)">
<img class="abs" src="assets/shapes/triangle-equilateral-orange.svg" alt="" style="left:510pt;top:560pt;width:34pt;height:34pt;transform:rotate(24deg)">
<img class="abs" src="assets/can-glow-web.webp" alt="VIVE Glow can" style="width:191.2pt;height:500pt;left:62pt;top:170pt;transform:rotate(-6deg);z-index:1">
<img class="abs" src="assets/can-focus-web.webp" alt="VIVE Focus can" style="width:191.2pt;height:500pt;left:342pt;top:170pt;transform:rotate(6deg);z-index:1">
<img class="abs" src="assets/can-classic-web.webp" alt="VIVE Classic can" style="width:214.1pt;height:560pt;left:190pt;top:124pt;transform:rotate(0deg);z-index:3">
<div class="abs banner"></div>
<span class="abs hint" style="left:0;width:595.28pt;text-align:center;top:732pt;color:var(--deep)">Tap anywhere to visit</span>
<span class="abs url" style="left:0;width:595.28pt;text-align:center;top:752pt;font-size:38pt;color:var(--white)">vive-cola.vercel.app</span>
</body>
</html>
