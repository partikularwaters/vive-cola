<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, height=630">
<title>VIVE OG Card · V3-Dark (Midnight Monumental)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap">
<style>
  :root {
    --orange: #F27A21;
    --navy: #2B3990;
    --sun: #F4BD6A;
    --white: #F9F9F9;
    --bg-dark: #0D1021;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background: var(--bg-dark);
    font-family: 'Montserrat', sans-serif;
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 80px 0 76px;
    -webkit-font-smoothing: antialiased;
  }

  /* Ambient Warm Glow behind can */
  .can-ambient-glow {
    position: absolute;
    right: 40px;
    top: 50%;
    transform: translateY(-50%);
    width: 580px;
    height: 580px;
    background: radial-gradient(circle, rgba(242, 122, 33, 0.42) 0%, rgba(43, 57, 144, 0.22) 50%, transparent 72%);
    pointer-events: none;
  }

  /* Left Editorial Block */
  .left-content {
    position: relative;
    z-index: 5;
    max-width: 620px;
  }

  .brand-wordmark {
    height: 48px;
    margin-bottom: 36px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  }

  h1.claim {
    margin: 0;
    font-size: 96px;
    font-weight: 900;
    text-transform: uppercase;
    line-height: 0.92;
    letter-spacing: -0.025em;
  }
  h1.claim span.white-line {
    display: block;
    color: var(--white);
  }
  h1.claim span.glow-line {
    display: block;
    color: var(--orange);
    text-shadow: 0 0 40px rgba(242, 122, 33, 0.4);
  }

  /* Right Hero Can */
  .can-container {
    position: relative;
    z-index: 6;
    width: 440px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hero-can {
    height: 570px;
    transform: rotate(5deg);
    filter: drop-shadow(-20px 28px 40px rgba(0, 0, 0, 0.8));
  }
</style>
</head>
<body>

<div class="can-ambient-glow"></div>

<div class="left-content">
  <img src="../assets/wordmark-vive-white.png" alt="VIVE" class="brand-wordmark">
  <h1 class="claim">
    <span class="white-line">GOOD VIBES.</span>
    <span class="glow-line">ZERO GUILT.</span>
  </h1>
</div>

<div class="can-container">
  <img src="../assets/can-original-hires.png" alt="VIVE Can" class="hero-can">
</div>

</body>
</html>
