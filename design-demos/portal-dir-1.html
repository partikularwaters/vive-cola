<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VIVE Web Portal — Direction 1: Sun Burst Trio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap');
  @page { size: 595.28pt 841.89pt; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --orange:#F27A21; --navy:#2B3990; --sun:#F4BD6A; --white:#F9F9F9; --deep:#1D2766; }
  html, body { width: 595.28pt; height: 841.89pt; overflow: hidden; position: relative;
               font-family: 'Montserrat', sans-serif; }
  a.global-router-overlay { position:absolute; top:0; left:0; width:595.28pt; height:841.89pt; z-index:1000; display:block; text-decoration:none; }
  .abs { position:absolute; display:block; }
  .tag { font-size:10.5pt; font-weight:800; letter-spacing:.16em; text-transform:uppercase; white-space:nowrap; }
  .url { font-weight:900; white-space:nowrap; letter-spacing:-.01em; }
  .hint { font-size:10pt; font-weight:600; letter-spacing:.04em; white-space:nowrap; }

  body { background: var(--orange); }
  .band { left:0; top:724pt; width:595.28pt; height:118pt; background: var(--navy); }

</style>
</head>
<body>
<a class="global-router-overlay" href="https://vive-cola.vercel.app" aria-label="Visit the VIVE website at vive-cola.vercel.app">&nbsp;</a>
<img class="abs" src="assets/wordmark-vive-white.png" alt="VIVE" style="left:34pt;top:34pt;width:132pt;height:33.9pt">
<span class="abs tag" style="right:34pt;top:44pt;color:var(--navy)">Official Web Portal</span>
<img class="abs" src="assets/shapes/star-10pt-sun.svg" alt="" style="left:27pt;top:118pt;width:541pt;height:541pt;z-index:0">
<img class="abs" src="assets/can-glow-web.webp" alt="VIVE Glow can" style="width:164.4pt;height:430pt;left:64pt;top:236pt;transform:rotate(-9deg);z-index:1">
<img class="abs" src="assets/can-focus-web.webp" alt="VIVE Focus can" style="width:164.4pt;height:430pt;left:367pt;top:236pt;transform:rotate(9deg);z-index:1">
<img class="abs" src="assets/can-classic-web.webp" alt="VIVE Classic can" style="width:198.8pt;height:520pt;left:198pt;top:170pt;transform:rotate(0deg);z-index:3">
<div class="abs band"></div>
<span class="abs hint" style="left:0;width:595.28pt;text-align:center;top:748pt;color:var(--sun)">Tap anywhere to visit</span>
<span class="abs url" style="left:0;width:595.28pt;text-align:center;top:770pt;font-size:38pt;color:var(--white)">vive-cola.vercel.app</span>
</body>
</html>
