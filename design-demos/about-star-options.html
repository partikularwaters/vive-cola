<!doctype html><meta charset="utf-8"><title>About hero star options</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap">
<style>body{margin:0;padding:32px;background:#F9F9F9 url(../assets/patterns/sparse-color.svg) 0 0/640px;font-family:Montserrat,sans-serif;color:#2B3990}
h1{margin:0 0 20px;font-weight:900;text-transform:uppercase;font-size:26px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:24px} figure{margin:0}
.st{position:relative;aspect-ratio:1;display:grid;place-items:end center;overflow:hidden;border-bottom:18px solid #1D2766}
.st i{position:absolute;left:-15%;right:-15%;top:6%;aspect-ratio:1;background:center/contain no-repeat}
.st img{position:relative;width:62%;filter:drop-shadow(0 16px 14px rgba(20,24,63,.3))}
figcaption{margin-top:10px;font-weight:700}</style>
<h1>Two-color stars behind VIVI</h1><div class="g"><figure><div class="st"><i style="background-image:url(../assets/shapes/star-10pt-concentric-navy-sun.svg)"></i><img src="../assets/mascot/vivi-pointing.webp" alt=""></div><figcaption><b>A</b> Navy ring, sun center</figcaption></figure><figure><div class="st"><i style="background-image:url(../assets/shapes/star-10pt-concentric-deep-sun.svg)"></i><img src="../assets/mascot/vivi-pointing.webp" alt=""></div><figcaption><b>B</b> Deep navy ring, sun center</figcaption></figure><figure><div class="st"><i style="background-image:url(../assets/shapes/star-10pt-concentric-sun-navy.svg)"></i><img src="../assets/mascot/vivi-pointing.webp" alt=""></div><figcaption><b>C</b> Sun ring, navy center</figcaption></figure><figure><div class="st"><i style="background-image:url(../assets/shapes/star-10pt-concentric-orange-white.svg)"></i><img src="../assets/mascot/vivi-pointing.webp" alt=""></div><figcaption><b>D</b> Orange ring, white center</figcaption></figure></div>
