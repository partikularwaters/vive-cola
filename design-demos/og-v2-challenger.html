<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, height=630">
<title>VIVE OG Card · V2-Challenger (DTC Challenger Punch)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap">
<style>
  :root {
    --orange: #F27A21;
    --navy: #2B3990;
    --sun: #F4BD6A;
    --white: #F9F9F9;
    --deep: #14183F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background: var(--navy);
    font-family: 'Montserrat', sans-serif;
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 70px 0 64px;
    -webkit-font-smoothing: antialiased;
  }

  /* Right Orange Dynamic Field */
  .orange-burst-field {
    position: absolute;
    right: -80px;
    top: -60px;
    bottom: -60px;
    width: 620px;
    background: var(--orange);
    transform: skewX(-10deg);
    box-shadow: -20px 0 45px rgba(0, 0, 0, 0.4);
  }

  /* Star in background */
  .burst-star {
    position: absolute;
    right: 60px;
    top: 50px;
    width: 520px;
    height: 520px;
    background: var(--sun);
    clip-path: polygon(
      50% 0%, 59.5% 20.8%, 79.4% 9.5%, 77% 32.3%, 97.6% 34.5%, 
      84.6% 50%, 97.6% 65.5%, 77% 67.7%, 79.4% 90.5%, 59.5% 79.2%, 
      50% 100%, 40.5% 79.2%, 20.6% 90.5%, 23% 67.7%, 2.4% 65.5%, 
      15.4% 50%, 2.4% 34.5%, 23% 32.3%, 20.6% 9.5%, 40.5% 20.8%
    );
    opacity: 0.9;
    transform: rotate(12deg);
  }

  /* Left Editorial Block (Billboard Scale) */
  .left-block {
    position: relative;
    z-index: 5;
    max-width: 560px;
  }

  .top-wordmark {
    height: 44px;
    margin-bottom: 24px;
  }

  .tag-ribbon {
    background: var(--sun);
    color: var(--navy);
    padding: 8px 18px;
    font-size: 20px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    display: inline-block;
    transform: rotate(-3deg);
    clip-path: polygon(2% 0, 100% 4%, 98% 100%, 0 96%);
    margin-bottom: 16px;
  }

  h1.giant-claim {
    margin: 0;
    font-size: 82px;
    font-weight: 900;
    text-transform: uppercase;
    line-height: 0.92;
    letter-spacing: -0.02em;
    color: var(--white);
  }
  h1.giant-claim em {
    font-style: normal;
    color: var(--orange);
    display: block;
  }

  .bullet-row {
    margin-top: 28px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .bullet-pill {
    background: rgba(255, 255, 255, 0.12);
    border: 2px solid rgba(255, 255, 255, 0.25);
    padding: 8px 16px;
    font-size: 16px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-radius: 4px;
    color: var(--white);
  }
  .bullet-pill.gold {
    background: var(--sun);
    color: var(--navy);
    border-color: var(--sun);
  }

  /* Right Massive Can Hero */
  .right-stage {
    position: relative;
    z-index: 6;
    width: 440px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hero-can {
    height: 550px;
    transform: rotate(6deg);
    filter: drop-shadow(-18px 26px 36px rgba(0, 0, 0, 0.55));
  }

  /* Big Circular Price Stamp */
  .price-stamp {
    position: absolute;
    left: 0;
    bottom: 90px;
    width: 120px;
    height: 120px;
    background: var(--white);
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--navy);
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    border: 4px solid var(--navy);
    transform: rotate(-10deg);
  }
  .price-stamp .amt {
    font-size: 38px;
    font-weight: 900;
    line-height: 0.9;
  }
  .price-stamp .sub {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.1em;
    color: var(--orange);
    margin-top: 2px;
  }
</style>
</head>
<body>

<div class="orange-burst-field"></div>
<div class="burst-star"></div>

<div class="left-block">
  <img src="../assets/wordmark-vive-white.png" alt="VIVE" class="top-wordmark">
  <div>
    <div class="tag-ribbon">Vitamin-Charged Cola</div>
  </div>
  <h1 class="giant-claim">
    GOOD VIBES.
    <em>ZERO GUILT.</em>
  </h1>

  <div class="bullet-row">
    <div class="bullet-pill gold">4 Vitamins</div>
    <div class="bullet-pill">100% Stevia</div>
    <div class="bullet-pill">0 Calories</div>
    <div class="bullet-pill">0g Sugar</div>
  </div>
</div>

<div class="right-stage">
  <img src="../assets/can-original-hires.png" alt="VIVE Can" class="hero-can">
  <div class="price-stamp">
    <span class="amt">₱67</span>
    <span class="sub">12 OZ</span>
  </div>
</div>

</body>
</html>
