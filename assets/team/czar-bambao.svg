<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bgCb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D2766"/>
      <stop offset="100%" stop-color="#2B3990"/>
    </linearGradient>
    <linearGradient id="burstCb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F27A21"/>
      <stop offset="100%" stop-color="#F4BD6A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgCb)"/>

  <!-- Brand Geometric Background Shards -->
  <polygon points="0,0 320,0 160,340" fill="#F27A21" opacity="0.38"/>
  <polygon points="600,0 600,480 380,240" fill="#F4BD6A" opacity="0.22"/>
  <polygon points="0,720 220,800 0,800" fill="#F27A21" opacity="0.28"/>
  <polygon points="600,620 600,800 340,800" fill="#14183F" opacity="0.6"/>

  <!-- 10-Point Star Aura -->
  <g transform="translate(300, 360) scale(1.6)" opacity="0.18">
    <polygon points="0,-120 23,-37 95,-70 59,2 119,37 45,72 70,144 0,95 -70,144 -45,72 -119,37 -59,2 -95,-70 -23,-37" fill="#F4BD6A"/>
  </g>

  <!-- Stylized Female Executive Silhouette (Chic Bob Haircut) -->
  <g fill="#F9F9F9" opacity="0.92">
    <!-- Long Swept Hair Behind Shoulders -->
    <path d="M210,260 C205,170 235,140 300,140 C365,140 395,170 390,260 C388,340 405,420 415,500 C405,520 380,510 375,470 C365,390 365,300 360,260 C350,170 250,170 240,260 C235,300 235,390 225,470 C220,510 195,520 185,500 C195,420 212,340 210,260 Z" fill="#F4BD6A"/>
    <!-- Head -->
    <ellipse cx="300" cy="272" rx="66" ry="80"/>
    <!-- Hair Front Waves -->
    <path d="M234,260 C234,180 250,152 300,152 C350,152 366,180 366,260 C358,210 338,175 300,175 C262,175 242,210 234,260 Z" fill="#F27A21"/>
    <!-- Neck -->
    <path d="M276,340 L276,396 L324,396 L324,340 Z"/>
    <!-- Blazer & Shoulders -->
    <path d="M170,540 C180,430 225,395 270,392 L300,460 L330,392 C375,395 420,430 430,540 L460,680 L140,680 Z"/>
    <!-- Creative Lapel Star Pin -->
    <polygon points="300,465 316,420 284,420" fill="#F4BD6A"/>
  </g>

  <!-- Monogram Badge -->
  <g transform="translate(300, 110)">
    <circle cx="0" cy="0" r="42" fill="url(#burstCb)"/>
    <text x="0" y="12" font-family="'Montserrat', 'Avenir Next', Arial, sans-serif" font-weight="900" font-size="28" fill="#14183F" text-anchor="middle" letter-spacing="1">CB</text>
  </g>

  <!-- Typography Card Baseline -->
  <rect x="50" y="660" width="500" height="90" rx="4" fill="#14183F" fill-opacity="0.9" stroke="#F4BD6A" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="300" y="696" font-family="'Montserrat', 'Avenir Next', Arial, sans-serif" font-weight="900" font-size="22" fill="#F9F9F9" text-anchor="middle" letter-spacing="2">CZAR BAMBAO</text>
  <text x="300" y="728" font-family="'Montserrat', 'Avenir Next', Arial, sans-serif" font-weight="800" font-size="14" fill="#F4BD6A" text-anchor="middle" letter-spacing="3">CHIEF MARKETING OFFICER</text>
</svg>