<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bgJm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14183F"/>
      <stop offset="100%" stop-color="#2B3990"/>
    </linearGradient>
    <linearGradient id="burstJm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4BD6A"/>
      <stop offset="100%" stop-color="#F27A21"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bgJm)"/>

  <!-- Brand Geometric Background Shards -->
  <polygon points="50,0 380,0 200,360" fill="#F27A21" opacity="0.32"/>
  <polygon points="600,0 600,440 380,200" fill="#F4BD6A" opacity="0.25"/>
  <polygon points="0,640 260,800 0,800" fill="#1D2766" opacity="0.55"/>
  <polygon points="600,580 600,800 340,800" fill="#F27A21" opacity="0.25"/>

  <!-- 10-Point Star Aura (Formulation Spark) -->
  <g transform="translate(300, 360) scale(1.6)" opacity="0.18">
    <polygon points="0,-120 23,-37 95,-70 59,2 119,37 45,72 70,144 0,95 -70,144 -45,72 -119,37 -59,2 -95,-70 -23,-37" fill="#F4BD6A"/>
  </g>

  <!-- Stylized Male Executive Silhouette -->
  <g fill="#F9F9F9" opacity="0.92">
    <!-- Head -->
    <ellipse cx="300" cy="270" rx="72" ry="88"/>
    <!-- Hair contour -->
    <path d="M228,270 C228,190 240,165 300,165 C360,165 372,190 372,270 C365,210 345,185 300,185 C255,185 235,210 228,270 Z" fill="#F4BD6A"/>
    <!-- Neck -->
    <path d="M272,345 L272,400 L328,400 L328,345 Z"/>
    <!-- Collar & Shoulders -->
    <path d="M160,540 C170,430 220,400 270,395 L300,440 L330,395 C380,400 430,430 440,540 L470,680 L130,680 Z"/>
    <!-- Lapel Accent -->
    <polygon points="300,442 314,460 310,560 300,580 290,560 286,460" fill="#F27A21"/>
  </g>

  <!-- Monogram Badge -->
  <g transform="translate(300, 110)">
    <circle cx="0" cy="0" r="42" fill="url(#burstJm)"/>
    <text x="0" y="12" font-family="'Montserrat', 'Avenir Next', Arial, sans-serif" font-weight="900" font-size="28" fill="#14183F" text-anchor="middle" letter-spacing="1">JM</text>
  </g>

  <!-- Typography Card Baseline -->
  <rect x="50" y="660" width="500" height="90" rx="4" fill="#14183F" fill-opacity="0.9" stroke="#F4BD6A" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="300" y="696" font-family="'Montserrat', 'Avenir Next', Arial, sans-serif" font-weight="900" font-size="22" fill="#F9F9F9" text-anchor="middle" letter-spacing="2">JOHN MADRID</text>
  <text x="300" y="728" font-family="'Montserrat', 'Avenir Next', Arial, sans-serif" font-weight="800" font-size="14" fill="#F4BD6A" text-anchor="middle" letter-spacing="3">CHIEF R&amp;D OFFICER</text>
</svg>