<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VIVE Router Poster — Direction 1: Charged Burst Hero</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');

    @page {
      size: 595.28pt 841.89pt;
      margin: 0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      width: 595.28pt;
      height: 841.89pt;
      overflow: hidden;
      background-color: #F27A21;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #2B3990;
      position: relative;
    }

    /* Full-page absolute router link for 100% click coverage in PDF */
    a.global-router-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 595.28pt;
      height: 841.89pt;
      z-index: 1000;
      display: block;
      background: transparent;
      text-decoration: none;
    }

    .poster-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32pt 36pt 24pt;
      background: radial-gradient(circle at 50% 42%, #ff8e38 0%, #F27A21 68%, #d9620b 100%);
    }

    /* Ambient Geometry */
    .bg-star {
      position: absolute;
      top: 41%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(18deg);
      width: 480pt;
      height: 480pt;
      opacity: 0.95;
      z-index: 1;
      pointer-events: none;
    }

    .bg-triangle-1 {
      position: absolute;
      top: 140pt;
      left: 30pt;
      width: 32pt;
      height: 32pt;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      background: #F4BD6A;
      transform: rotate(-25deg);
      opacity: 0.85;
      z-index: 1;
    }

    .bg-triangle-2 {
      position: absolute;
      top: 260pt;
      right: 36pt;
      width: 42pt;
      height: 42pt;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      background: #2B3990;
      transform: rotate(40deg);
      opacity: 0.8;
      z-index: 1;
    }

    .bg-triangle-3 {
      position: absolute;
      bottom: 220pt;
      left: 45pt;
      width: 28pt;
      height: 28pt;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      background: #F9F9F9;
      transform: rotate(15deg);
      opacity: 0.75;
      z-index: 1;
    }

    /* Header */
    .header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      width: 156pt;
      height: auto;
    }

    .header-badge {
      display: inline-block;
      background: #2B3990;
      color: #F9F9F9;
      font-weight: 800;
      font-size: 8.5pt;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6pt 12pt;
      transform: rotate(-2deg);
      clip-path: polygon(2% 0, 100% 6%, 98% 100%, 0 94%);
      box-shadow: 2pt 3pt 0 #14183F;
    }

    /* Center Visual Stage */
    .hero-stage {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: -10pt;
    }

    .headline-wrap {
      text-align: center;
      margin-bottom: 8pt;
      position: relative;
      z-index: 15;
    }

    .label {
      display: inline-block;
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1.05;
      padding: 4pt 14pt 5pt;
      font-size: 24pt;
      letter-spacing: 0.02em;
    }

    .label.navy {
      background: #2B3990;
      color: #F9F9F9;
      transform: rotate(-2.5deg);
      clip-path: polygon(1% 0, 100% 4%, 99% 100%, 0 96%);
      box-shadow: 3pt 4pt 0 #14183F;
    }

    .label.sun {
      background: #F4BD6A;
      color: #1D2766;
      transform: rotate(1.5deg);
      margin-top: 4pt;
      font-size: 27pt;
      clip-path: polygon(1% 4%, 100% 0, 99% 96%, 0 100%);
      box-shadow: 3pt 4pt 0 #2B3990;
    }

    .can-splash-stage {
      position: relative;
      width: 320pt;
      height: 380pt;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .can-img {
      position: relative;
      height: 330pt;
      width: auto;
      z-index: 10;
      filter: drop-shadow(0 20pt 25pt rgba(20, 24, 63, 0.45));
    }

    .cola-splash {
      position: absolute;
      top: 30pt;
      left: 10pt;
      width: 300pt;
      height: auto;
      opacity: 0.85;
      z-index: 4;
      pointer-events: none;
    }

    .ice-1 {
      position: absolute;
      top: 50pt;
      right: 25pt;
      width: 48pt;
      height: auto;
      z-index: 11;
      transform: rotate(18deg);
      filter: drop-shadow(0 4pt 8pt rgba(0,0,0,0.25));
    }

    .ice-2 {
      position: absolute;
      bottom: 60pt;
      left: 30pt;
      width: 38pt;
      height: auto;
      z-index: 11;
      transform: rotate(-22deg);
      filter: drop-shadow(0 4pt 8pt rgba(0,0,0,0.25));
    }

    /* Vitamin Stamps */
    .vitamin-burst {
      position: absolute;
      width: 44pt;
      height: 44pt;
      background: #2B3990;
      color: #F4BD6A;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      z-index: 12;
      border: 2pt solid #F4BD6A;
      box-shadow: 0 4pt 10pt rgba(20, 24, 63, 0.35);
      line-height: 1;
    }

    .vitamin-burst span.vit-num {
      font-size: 13pt;
      color: #F9F9F9;
    }

    .vitamin-burst span.vit-label {
      font-size: 6pt;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #F4BD6A;
    }

    .vit-pos-1 { top: 90pt; left: 15pt; transform: rotate(-8deg); }
    .vit-pos-2 { top: 160pt; left: 5pt; transform: rotate(10deg); }
    .vit-pos-3 { top: 110pt; right: 15pt; transform: rotate(6deg); }
    .vit-pos-4 { top: 185pt; right: 10pt; transform: rotate(-12deg); }

    /* Pill Badges */
    .badge-strip {
      display: flex;
      gap: 10pt;
      margin-top: 4pt;
      position: relative;
      z-index: 15;
    }

    .pill-tag {
      background: #F9F9F9;
      color: #2B3990;
      font-weight: 900;
      font-size: 9pt;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 5pt 12pt;
      border: 2pt solid #2B3990;
      box-shadow: 2pt 3pt 0 #2B3990;
    }

    .pill-tag.dark {
      background: #14183F;
      color: #F4BD6A;
      border-color: #F4BD6A;
      box-shadow: 2pt 3pt 0 #14183F;
    }

    /* Launchpad Footer (Router Interface) */
    .launchpad-card {
      position: relative;
      z-index: 10;
      background: #1D2766;
      color: #F9F9F9;
      padding: 16pt 20pt 14pt;
      clip-path: polygon(0 14pt, 100% 0, 100% 100%, 0 100%);
      box-shadow: 0 12pt 30pt rgba(20, 24, 63, 0.4);
      border-top: 3pt solid #F4BD6A;
      margin-top: 4pt;
    }

    .router-cta-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10pt;
      background: #F4BD6A;
      color: #1D2766;
      font-weight: 900;
      font-size: 13pt;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 11pt 16pt;
      clip-path: polygon(0 0, 100% 0, calc(100% - 10pt) 100%, 0 100%);
      box-shadow: 0 4pt 0 #0f1538;
      text-align: center;
    }

    .router-cta-button .arrow-indicator {
      font-size: 16pt;
      line-height: 1;
    }

    .router-telemetry {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10pt;
      padding-top: 8pt;
      border-top: 1pt solid rgba(244, 189, 106, 0.3);
    }

    .beacon-group {
      display: flex;
      align-items: center;
      gap: 6pt;
    }

    .live-dot {
      width: 8pt;
      height: 8pt;
      background: #34D399;
      border-radius: 50%;
      box-shadow: 0 0 8pt #34D399;
    }

    .live-url {
      font-weight: 800;
      font-size: 10pt;
      color: #F4BD6A;
      letter-spacing: 0.04em;
    }

    .click-anywhere-hint {
      font-weight: 700;
      font-size: 8pt;
      color: #F9F9F9;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.9;
    }

    .retailers-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18pt;
      margin-top: 10pt;
      opacity: 0.85;
    }

    .retailers-strip span {
      font-weight: 700;
      font-size: 7pt;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #F4BD6A;
    }

    .retailers-strip img {
      height: 13pt;
      width: auto;
      filter: brightness(0) invert(1);
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <!-- Full-Page Interactive PDF Link Overlay -->
  <a class="global-router-overlay" href="https://vive-cola.vercel.app" aria-label="Enter live VIVE website at vive-cola.vercel.app">&nbsp;</a>

  <div class="poster-container">
    <!-- Ambient Brand Shapes -->
    <img class="bg-star" src="assets/shapes/star-10pt-sun.svg" alt="10-point brand star">
    <div class="bg-triangle-1"></div>
    <div class="bg-triangle-2"></div>
    <div class="bg-triangle-3"></div>

    <!-- Header Navigation Bar -->
    <header class="header">
      <img class="brand-logo" src="assets/logo-vive-navy-tagline.png" alt="VIVE Vitamin-Charged Cola">
      <div class="header-badge">Live Production Portal</div>
    </header>

    <!-- Center Hero Section -->
    <main class="hero-stage">
      <div class="headline-wrap">
        <div><span class="label navy">YOUR DAILY DOSE</span></div>
        <div><span class="label sun">OF GOOD VIBES</span></div>
      </div>

      <div class="can-splash-stage">
        <!-- Floating Vitamin Badges -->
        <div class="vitamin-burst vit-pos-1">
          <span class="vit-num">A</span>
          <span class="vit-label">Vision</span>
        </div>
        <div class="vitamin-burst vit-pos-2">
          <span class="vit-num">B9</span>
          <span class="vit-label">Folate</span>
        </div>
        <div class="vitamin-burst vit-pos-3">
          <span class="vit-num">B12</span>
          <span class="vit-label">Energy</span>
        </div>
        <div class="vitamin-burst vit-pos-4">
          <span class="vit-num">C</span>
          <span class="vit-label">Immunity</span>
        </div>

        <img class="cola-splash" src="assets/cola-splash.png" alt="Cola Splash">
        <img class="can-img" src="assets/can-classic-web.webp" alt="VIVE Classic Can">
        <img class="ice-1" src="assets/ice-cube.png" alt="Ice Cube">
        <img class="ice-2" src="assets/ice-cube.png" alt="Ice Cube">
      </div>

      <div class="badge-strip">
        <div class="pill-tag dark">100% Stevia Sweetened</div>
        <div class="pill-tag">Zero Calories</div>
        <div class="pill-tag dark">12 FL OZ (355 ML)</div>
      </div>
    </main>

    <!-- Interactive Launchpad Footer -->
    <footer class="launchpad-card">
      <div class="router-cta-button">
        <span class="arrow-indicator">⚡</span>
        <span>Click Anywhere to Enter Official Website</span>
        <span class="arrow-indicator">⚡</span>
      </div>

      <div class="router-telemetry">
        <div class="beacon-group">
          <div class="live-dot"></div>
          <div class="live-url">vive-cola.vercel.app</div>
        </div>
        <div class="click-anywhere-hint">Single-Tap Digital Router</div>
      </div>

      <div class="retailers-strip">
        <span>Available At:</span>
        <img src="assets/lawson-logo-white.png" alt="Lawson">
        <img src="assets/seven-eleven-logo.svg" alt="7-Eleven">
        <img src="assets/sm-logo-white.svg" alt="SM Supermalls">
        <img src="assets/ayala-malls-logo-white.png" alt="Ayala Malls">
      </div>
    </footer>
  </div>
</body>
</html>
