<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, height=630">
<title>VIVE OG Card · V2-Trio (Flavor Trio Lineup)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap">
<style>
  :root {
    --orange: #F27A21;
    --navy: #2B3990;
    --sun: #F4BD6A;
    --white: #F9F9F9;
    --dark: #0E101D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background: var(--dark);
    font-family: 'Montserrat', sans-serif;
    color: var(--white);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 30px 40px 28px;
    -webkit-font-smoothing: antialiased;
  }

  /* Center Radial Ambient Warmth */
  .center-glow {
    position: absolute;
    left: 50%;
    top: 55%;
    transform: translate(-50%, -50%);
    width: 800px;
    height: 480px;
    background: radial-gradient(circle, rgba(242, 122, 33, 0.35) 0%, rgba(43, 57, 144, 0.2) 50%, transparent 70%);
    pointer-events: none;
  }

  /* Top Massive Header */
  .top-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    z-index: 5;
  }
  .wordmark-large {
    height: 52px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  }
  .category-strap {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--sun);
  }

  /* Center Giant Trio Stage */
  .trio-stage {
    position: relative;
    width: 960px;
    height: 400px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 40px;
    z-index: 4;
  }

  /* Plinth Shadow */
  .stage-shadow {
    position: absolute;
    bottom: 0;
    width: 780px;
    height: 20px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.85) 0%, transparent 70%);
    pointer-events: none;
  }

  .can-item {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .can-item.decaf img {
    height: 340px;
    filter: drop-shadow(0 14px 24px rgba(0,0,0,0.6));
    transform: rotate(-3deg);
  }
  .can-item.original img {
    height: 410px;
    filter: drop-shadow(0 20px 32px rgba(0,0,0,0.75));
    z-index: 3;
    margin-bottom: -5px;
  }
  .can-item.extra img {
    height: 340px;
    filter: drop-shadow(0 14px 24px rgba(0,0,0,0.6));
    transform: rotate(3deg);
  }

  .can-label {
    position: absolute;
    bottom: -10px;
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 3px 10px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .can-item.decaf .can-label { background: #E4CEAF; color: var(--navy); }
  .can-item.original .can-label { background: var(--orange); color: var(--white); bottom: -14px; font-size: 15px; }
  .can-item.extra .can-label { background: var(--sun); color: var(--navy); }

  /* Bottom Telemetry Bar */
  .bottom-bar {
    background: var(--navy);
    border: 2px solid rgba(244, 189, 106, 0.3);
    border-radius: 999px;
    padding: 12px 36px;
    display: flex;
    align-items: center;
    gap: 24px;
    font-size: 18px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    z-index: 5;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  .bottom-bar span.accent {
    color: var(--sun);
  }
  .bottom-bar span.pipe {
    color: rgba(255, 255, 255, 0.3);
  }
</style>
</head>
<body>

<div class="center-glow"></div>

<!-- Top Branding -->
<div class="top-header">
  <img src="../assets/wordmark-vive-white.png" alt="VIVE" class="wordmark-large">
  <div class="category-strap">The Vitamin-Charged Cola</div>
</div>

<!-- Trio Cans Stage -->
<div class="trio-stage">
  <div class="stage-shadow"></div>

  <div class="can-item decaf">
    <img src="../assets/can-decaffeinated-crop.png" alt="Decaffeinated">
    <span class="can-label">Relaxing Vibes</span>
  </div>

  <div class="can-item original">
    <img src="../assets/can-original-hires.png" alt="Original">
    <span class="can-label">Good Vibes</span>
  </div>

  <div class="can-item extra">
    <img src="../assets/can-extra-caffeine-crop.png" alt="Extra Caffeine">
    <span class="can-label">Grind Vibes</span>
  </div>
</div>

<!-- Bottom High-Impact Ribbon -->
<div class="bottom-bar">
  <span class="accent">Vitamins A · C · B9 · B12</span>
  <span class="pipe">/</span>
  <span>100% Stevia</span>
  <span class="pipe">/</span>
  <span>0 Calories</span>
  <span class="pipe">/</span>
  <span class="accent">₱67</span>
</div>

</body>
</html>
