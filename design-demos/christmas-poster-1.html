<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VIVE Christmas Poster — Direction 1: Challenger Festive Feast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,900&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #F27A21;
    --navy: #2B3990;
    --sun: #F4BD6A;
    --white: #F9F9F9;
    --deep: #1D2766;
    --tree-green: #11532F;
    --tree-green-light: #1A6C3E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 1700px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: var(--orange);
    font-family: 'Montserrat', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .poster {
    position: relative;
    width: 1200px;
    height: 1700px;
    background: var(--orange);
    overflow: hidden;
  }

  /* Radiant festive background ray & particle textures */
  .bg-glow {
    position: absolute;
    top: 360px;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 1100px;
    height: 1100px;
    background: radial-gradient(circle, rgba(244, 189, 106, 0.35) 0%, rgba(242, 122, 33, 0) 70%);
    z-index: 1;
    pointer-events: none;
  }

  /* Scattered background geometric particles */
  .bg-scatter {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .particle {
    position: absolute;
    width: 0;
    height: 0;
    border-style: solid;
  }
  .p1 {
    top: 140px; right: 120px;
    border-width: 0 16px 36px 16px;
    border-color: transparent transparent var(--sun) transparent;
    transform: rotate(24deg);
    opacity: 0.85;
  }
  .p2 {
    top: 280px; left: 100px;
    border-width: 0 14px 30px 14px;
    border-color: transparent transparent var(--navy) transparent;
    transform: rotate(-18deg);
    opacity: 0.8;
  }
  .p3 {
    top: 520px; right: 80px;
    border-width: 0 20px 42px 20px;
    border-color: transparent transparent var(--white) transparent;
    transform: rotate(35deg);
    opacity: 0.65;
  }
  .p4 {
    top: 720px; left: 60px;
    border-width: 0 18px 38px 18px;
    border-color: transparent transparent var(--sun) transparent;
    transform: rotate(-30deg);
    opacity: 0.75;
  }

  /* Top Bar Branding */
  .header {
    position: absolute;
    top: 54px;
    left: 64px;
    right: 64px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 30;
  }
  .logo-vive {
    height: 52px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
  }
  .holiday-tag {
    background: var(--navy);
    color: var(--sun);
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 10px 22px;
    clip-path: polygon(4% 0, 100% 8%, 96% 100%, 0 92%);
    box-shadow: 0 4px 14px rgba(29, 39, 102, 0.25);
  }

  /* Tree & Star Centerpiece */
  /* The acute triangle is scaled large, zoomed in so only the upper part shows */
  .tree-container {
    position: absolute;
    top: 360px;
    left: 50%;
    transform: translateX(-50%);
    width: 1300px;
    height: 1800px;
    z-index: 5;
    pointer-events: none;
  }
  .tree-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 20px 45px rgba(17, 83, 47, 0.35));
  }

  /* Star sits at the top, center touching the tip of the tree */
  /* Tree tip is at (650, 0) inside container, positioned at y=360px */
  .star-container {
    position: absolute;
    top: 360px;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 320px;
    height: 320px;
    z-index: 6;
  }
  .star-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 12px 30px rgba(0,0,0,0.28));
  }

  /* Main Headline Lockup */
  .headline-lockup {
    position: absolute;
    top: 600px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 15;
    text-align: center;
    pointer-events: none;
  }
  .ribbon-top {
    display: inline-block;
    background: var(--navy);
    color: var(--white);
    font-size: 56px;
    font-weight: 900;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    padding: 14px 44px 18px;
    clip-path: polygon(2% 0, 100% 6%, 98% 100%, 0 94%);
    transform: rotate(-2.5deg);
    box-shadow: 0 10px 30px rgba(43, 57, 144, 0.35);
  }
  .ribbon-top .highlight {
    color: var(--sun);
  }
  .ribbon-bottom {
    margin-top: 14px;
    display: inline-block;
    background: var(--white);
    color: var(--navy);
    font-size: 96px;
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    padding: 12px 52px 18px;
    clip-path: polygon(0 6%, 98% 0, 100% 94%, 2% 100%);
    transform: rotate(1.2deg);
    box-shadow: 0 16px 40px rgba(0,0,0,0.22);
  }

  /* Subtitle Nutritional Fact */
  .sub-pill {
    margin-top: 24px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.95);
    color: var(--navy);
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 28px;
    border-radius: 40px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  }
  .sub-pill .dot {
    color: var(--orange);
  }

  /* Forefront Hero Objects */
  .foreground {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 780px;
    z-index: 20;
    pointer-events: none;
  }

  /* Ground shadow base */
  .ground-shadow {
    position: absolute;
    bottom: 110px;
    left: 50%;
    transform: translateX(-50%);
    width: 1050px;
    height: 90px;
    background: radial-gradient(ellipse at center, rgba(17, 24, 63, 0.45) 0%, rgba(242, 122, 33, 0) 70%);
    z-index: 18;
  }

  /* Left: Lechon Belly */
  .lechon-wrap {
    position: absolute;
    bottom: 120px;
    left: 40px;
    width: 580px;
    z-index: 22;
    filter: drop-shadow(0 24px 35px rgba(29, 39, 102, 0.45));
    transform: rotate(-3deg);
  }
  .lechon-img {
    width: 100%;
    display: block;
  }
  .lechon-label {
    position: absolute;
    top: 40px;
    left: 20px;
    background: var(--navy);
    color: var(--sun);
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 8px 18px;
    clip-path: polygon(4% 0, 100% 6%, 96% 100%, 0 94%);
    transform: rotate(-6deg);
    box-shadow: 0 6px 16px rgba(0,0,0,0.25);
  }

  /* Right: VIVE Can */
  .can-wrap {
    position: absolute;
    bottom: 100px;
    right: 70px;
    width: 390px;
    z-index: 25;
    filter: drop-shadow(0 28px 45px rgba(17, 24, 63, 0.5));
    transform: rotate(4deg);
  }
  .can-img {
    width: 100%;
    display: block;
  }

  /* Price Burst Badge */
  .price-badge {
    position: absolute;
    bottom: 480px;
    right: 360px;
    width: 160px;
    height: 160px;
    z-index: 28;
    filter: drop-shadow(0 12px 25px rgba(0,0,0,0.3));
    transform: rotate(-10deg);
  }

  /* Footer: Retailers on bottom right */
  .footer {
    position: absolute;
    bottom: 40px;
    left: 64px;
    right: 64px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 30;
  }
  .footer-left {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .footer-claim {
    font-size: 14px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--navy);
  }
  .footer-vitamins {
    font-size: 12px;
    font-weight: 800;
    color: rgba(43, 57, 144, 0.75);
    letter-spacing: 0.06em;
  }
  .retailers-box {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }
  .retailers-label {
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--navy);
  }
  .retailers-img {
    height: 38px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.12));
  }
</style>
</head>
<body>

<div class="poster">
  <!-- Glow & Particles -->
  <div class="bg-glow"></div>
  <div class="bg-scatter">
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
  </div>

  <!-- Header -->
  <header class="header">
    <img class="logo-vive" src="../assets/logo-vive-navy-tagline.png" alt="VIVE The Vitamin-Charged Cola">
    <div class="holiday-tag">HOLIDAY EDITION • 2026</div>
  </header>

  <!-- Acute Triangle Tree (Turned into Green, Zoomed in) -->
  <div class="tree-container">
    <svg class="tree-svg" viewBox="0 0 1024 1024" preserveAspectRatio="none">
      <defs>
        <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1A6C3E" />
          <stop offset="50%" stop-color="#11532F" />
          <stop offset="100%" stop-color="#0B3C21" />
        </linearGradient>
      </defs>
      <!-- Base acute triangle matching triangle-acute-orange.svg geometry -->
      <polygon points="512.0,40.0 772.0,960.0 252.0,960.0" fill="url(#treeGrad)" />
      <!-- Stylized festive tier accents -->
      <path d="M460,260 L512,180 L564,260 Z" fill="#20824B" opacity="0.4" />
      <path d="M410,480 L512,360 L614,480 Z" fill="#20824B" opacity="0.3" />
      <path d="M350,720 L512,540 L674,720 Z" fill="#20824B" opacity="0.25" />
    </svg>
  </div>

  <!-- Star sits at top, center touching tip of tree -->
  <div class="star-container">
    <svg class="star-svg" viewBox="0 0 1024 1024">
      <!-- 10-point star matching star-10pt-tilted-12deg-sun.svg -->
      <polygon points="618.5,11.2 669.3,239.8 892.7,168.9 820.1,392.2 1021.8,458.1 858.6,585.7 955.8,768.6 744.8,746.8 720.3,980.3 545.0,824.7 405.5,1012.8 354.7,784.2 131.3,855.1 203.9,631.8 2.2,565.9 165.4,438.3 68.2,255.4 279.2,277.2 303.7,43.7 479.0,199.3" fill="#F4BD6A" />
    </svg>
  </div>

  <!-- Headline -->
  <div class="headline-lockup">
    <div class="ribbon-top">
      Noche Buena drink<span class="highlight">?</span>
    </div>
    <div class="ribbon-bottom">
      WE GOTCHA!
    </div>
    <div class="sub-pill">
      <span>100% Stevia</span>
      <span class="dot">•</span>
      <span>0 Calories</span>
      <span class="dot">•</span>
      <span>Vitamins A, C, B9, B12</span>
    </div>
  </div>

  <!-- Forefront Elements: Lechon Belly & Vive Can -->
  <div class="foreground">
    <div class="ground-shadow"></div>

    <!-- Lechon Belly (Left) -->
    <div class="lechon-wrap">
      <div class="lechon-label">CRISPY LIEMPO FEAST</div>
      <img class="lechon-img" src="../assets/lechon-belly-placeholder.png" alt="Crispy Roasted Lechon Belly">
    </div>

    <!-- Price Burst Badge -->
    <img class="price-badge" src="../source/deck-extract/badge-price-67-sun.png" alt="₱67 Only">

    <!-- Vive Original Can (Right) -->
    <div class="can-wrap">
      <img class="can-img" src="../assets/can-original-hires.png" alt="VIVE Original Vitamin-Charged Cola">
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-left">
      <div class="footer-claim">THE VITAMIN-CHARGED COLA</div>
      <div class="footer-vitamins">GOOD VIBES • ZERO GUILT • 12 FL OZ (355ML)</div>
    </div>
    <div class="retailers-box">
      <div class="retailers-label">AVAILABLE AT LEADING STORES</div>
      <img class="retailers-img" src="../assets/retailers.png" alt="Lawson, 7-Eleven, SM, Ayala Malls">
    </div>
  </footer>
</div>

</body>
</html>
